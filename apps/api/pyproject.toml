[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-api"
version = "0.1.0"
description = "FastAPI backend: analysis lifecycle, transcription, correction, feedback and history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chess-contracts",
    "chess-vision",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]
